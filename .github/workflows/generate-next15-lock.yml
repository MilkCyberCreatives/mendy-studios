name: Validate and refresh dependencies
on:
  push:
    branches: [agent/next15-lts-migration]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh lockfile
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit generated dependency files to migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json tsconfig.json
          if git diff --cached --quiet; then
            echo "Generated dependency files are already current."
            exit 0
          fi
          git commit -m "chore: refresh lockfile for Next.js 16"
          git push origin HEAD:agent/next15-lts-migration
