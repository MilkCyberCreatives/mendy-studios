name: Finalize Next.js 16 migration
on:
  push:
    branches: [agent/next15-lts-migration]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Remove migration-only helpers and finalize branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm src/app/api/internal/lockfile/route.ts .github/workflows/generate-next15-lock.yml
          git commit -m "chore: remove migration-only validation helpers"
          git push origin HEAD:agent/next15-lts-migration
